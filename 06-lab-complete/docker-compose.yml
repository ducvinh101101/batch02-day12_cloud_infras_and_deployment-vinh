services:
  agent:
    build: .
    environment:
      ENVIRONMENT: staging
      AGENT_API_KEY: ${AGENT_API_KEY:-dev-key-change-me}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      DEMO_MODE: ${DEMO_MODE:-true}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-10.0}
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
      - data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    networks: [agent_net]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [agent_net]

  nginx:
    image: nginx:alpine
    ports: ["8000:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped
    networks: [agent_net]

volumes:
  uploads:
  outputs:
  data:
  redis_data:

networks:
  agent_net:
    driver: bridge
